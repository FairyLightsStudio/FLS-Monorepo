[workspace]
members = ["terapanel", "terad", "shared-types"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["FlightStudio"]
license = "Apache-2.0"
homepage = "https://github.com/flightstudio/terapanel"
repository = "https://github.com/flightstudio/terapanel"

[workspace.dependencies]
# base
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
config = "0.15"

# communication
async-nats = "0.45"

futures = "0.3"
sqlx = "0.8"
pilota = "0"
pilota-build = "0"
volo = "0.12"
volo-grpc = { version = "0.12", features = ["grpc-web"] }
motore = "0.4"
metainfo = "0.7"
volo-build = "0.12"
prost = "0.12"
