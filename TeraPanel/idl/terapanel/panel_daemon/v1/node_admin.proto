syntax = "proto3";
package terapanel.panel_daemon.v1;

import "terapanel/domain/v1/deps.proto";
import "terapanel/domain/v1/file.proto";
import "terapanel/domain/v1/metrics.proto";

// File operations
message FileListRequest {
  string path = 1;
  bool recursive = 2;
}

message FileListResponse {
  repeated FileInfo entries = 1;
}

message FileGetRequest {
  string path = 1;
  uint64 offset = 2;
  uint64 limit = 3;
}

message FileGetResponse {
  bytes content = 1;
}

message FilePutRequest {
  string path = 1;
  bytes content = 2;
  bool overwrite = 3;
  uint32 mode = 4;
}

message FilePutResponse {
  uint64 bytes_written = 1;
}

message FileDeleteRequest {
  string path = 1;
  bool recursive = 2;
}

message FileDeleteResponse {
  bool success = 1;
}

message FileRenameRequest {
  string old_path = 1;
  string new_path = 2;
}

message FileRenameResponse {
  bool success = 1;
}

message FileMkdirRequest {
  string path = 1;
  bool recursive = 2;
  uint32 mode = 3;
}

message FileMkdirResponse {
  bool success = 1;
}

message FileStatRequest {
  string path = 1;
}

message FileStatResponse {
  FileInfo info = 1;
}

// Metrics
message GetMetricsRequest {}

message GetMetricsResponse {
  Metrics metrics = 1;
}

// Package management
message ListPackagesRequest {
  string query = 1;
  PackageManager manager = 2;
}

message ListPackagesResponse {
  repeated PackageInfo packages = 1;
}

message InstallPackageRequest {
  string package_name = 1;
  string version = 2;
  PackageManager manager = 3;
}

message InstallPackageResponse {
  bool success = 1;
  string output = 2;
}

message UninstallPackageRequest {
  string package_name = 1;
  PackageManager manager = 2;
}

message UninstallPackageResponse {
  bool success = 1;
  string output = 2;
}

message UpdatePackageRequest {
  string package_name = 1;
  PackageManager manager = 2;
}

message UpdatePackageResponse {
  bool success = 1;
  string output = 2;
}
