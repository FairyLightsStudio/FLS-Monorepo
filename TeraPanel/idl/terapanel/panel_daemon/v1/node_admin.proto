syntax = "proto3";
package terapanel.panel_daemon.v1;

import "terapanel/domain/v1/file.proto";
import "terapanel/domain/v1/metrics.proto";

// File operations
message FileListRequest {
  terapanel.domain.v1.FileLocation location = 1;
}

message FileListResponse {
  repeated terapanel.domain.v1.FileInfo entries = 1;
}

message FileGetRequest {
  string path = 1;
  uint64 offset = 2;
  uint64 limit = 3;
}

message FileGetResponse {
  bytes content = 1;
}

message FilePutRequest {
  terapanel.domain.v1.FileLocation location = 1;
  bytes content = 2;
  bool overwrite = 3;
  uint32 mode = 4;
}

message FilePutResponse {
  uint64 bytes_written = 1;
}

message FileDeleteRequest {
  terapanel.domain.v1.FileLocation location = 1;
  bool move_to_trash = 2;
}

message FileDeleteResponse {
  bool success = 1;
}

message FileRenameRequest {
  terapanel.domain.v1.FileLocation old_location = 1;
  terapanel.domain.v1.FileLocation new_location = 2;
}

message FileRenameResponse {
  bool success = 1;
}

message FileMkdirRequest {
  terapanel.domain.v1.FileLocation location = 1;
  bool recursive = 2;
  uint32 mode = 3;
}

message FileMkdirResponse {
  bool success = 1;
}

message FileStatRequest {
  terapanel.domain.v1.FileLocation location = 1;
}

message FileStatResponse {
  terapanel.domain.v1.FileInfo info = 1;
}

// Metrics
message GetMetricsRequest {}

message GetMetricsResponse {
  terapanel.domain.v1.Metrics metrics = 1;
}

