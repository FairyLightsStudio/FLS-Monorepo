syntax = "proto3";
package terapanel.domain.v1;

import "google/protobuf/timestamp.proto";

message MemoryUsage {
  uint64 total = 1;
  uint64 used = 2;
  uint64 free = 3;
  uint64 swap_total = 4;
  uint64 swap_used = 5;
}

message NetworkInterfaceStats {
  string name = 1;
  uint64 bytes_sent = 2;
  uint64 bytes_recv = 3;
  uint64 packets_sent = 4;
  uint64 packets_recv = 5;
  uint64 errors_in = 6;
  uint64 errors_out = 7;
}

message NetworkIO {
  repeated NetworkInterfaceStats interfaces = 1;
}

message DiskDeviceStats {
  string device = 1;
  uint64 read_bytes = 2;
  uint64 write_bytes = 3;
  uint64 read_ops = 4;
  uint64 write_ops = 5;
  uint64 busy_time = 6;
}

message DiskIO {
  repeated DiskDeviceStats devices = 1;
}

message Metrics {
  double cpu_usage_percent = 1;
  MemoryUsage memory = 2;
  NetworkIO network = 3;
  DiskIO disk = 4;
  google.protobuf.Timestamp timestamp = 5;
}
