syntax = "proto3";
package terapanel.domain.v1;

import "google/protobuf/timestamp.proto";

message FileInfo {
  string name = 1;
  string path = 2;
  bool is_dir = 3;
  uint64 size = 4;
  string permissions = 5;
  google.protobuf.Timestamp mod_time = 6;
  string owner = 7;
  string group = 8;
}

message DirectoryListing {
  string current_path = 1;
  repeated FileInfo entries = 2;
}

message FileChunk {
  bytes data = 1;
}
