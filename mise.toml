min_version = "2026.7.17"

[tool_alias]
fls = "github:FairyLightsStudio/FLS-Monorepo"
buck2 = "github:facebook/buck2"

[tools]
buck2 = { version = "2026-08-01", matching_regex = '^buck2-(aarch64|riscv64gc|x86_64)-', bin = "buck2" }
rust = "1.97.1"
bun = "1.3.14"
node = "24.18.0"
fls = { version = "0.1.0", version_prefix = "fls-v", matching_regex = '^fls-.*\.(tar\.gz|zip)$' , github_attestations = false}
# because of github api poor rate limit for ghost, we disable attestations for fls
[tasks.build-fls]
description = "build fls with Buck2"
run = "buck2 build //tools/fls:fls"

[tasks.test-fls]
description = "use Buck2 to test fls"
run = "buck2 test //tools/fls:fls-test"

[tasks.doctor]
description = "build fls and check the entire monorepo"
run = '''
fls_path="$(buck2 build //tools/fls:fls --show-full-output --console=simple | awk '$1 ~ /tools\/fls:fls/ { print $2 }')"
"${fls_path}" doctor
'''
