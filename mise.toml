min_version = "2026.7.17"

[tool_alias]
fls = "github:FairyLightsStudio/FLS-Monorepo"

[settings]
# 只生成团队实际使用的平台条目：riscv64 上不跑这些开发工具，
# 平台少一些，锁文件更小、刷新也更快。
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "linux-x64-musl",
  "linux-arm64-musl",
  "macos-x64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]

[tools]
# 构建图相关工具与 .bazelversion / MODULE.bazel 保持一致；其余工具用宽松版本，
# 精确版本由 mise.lock 记录（CI 用 `mise install --locked` 安装）。
bazel = "9.3"
rust = "1.99"
node = "26"
pnpm = "12"
# fls 是本仓自己的工具：关掉 24h 的 minimum_release_age 延迟，发版即可用
fls = { version = "0.1", version_prefix = "fls-v", matching_regex = '^fls-.*\.(tar\.gz|zip)$' , minimum_release_age = "0s", github_attestations = false}
# because of github api poor rate limit for ghost, we disable attestations for fls
# NOTE: the build system for this monorepo is Bazel (see MODULE.bazel / .bazelversion).
# Bazel 由 mise 提供；.bazelversion 是仓库内的权威版本号（两者需保持一致）。

[tasks.build-fls]
description = "build fls with Bazel"
run = "bazel build //tools/fls:fls"

[tasks.test-fls]
description = "use Bazel to test fls"
run = "bazel test //tools/fls:fls-test"

[tasks.doctor]
description = "build fls and check the entire monorepo"
run = '''
bazel build //tools/fls:fls
"$(pwd)/bazel-bin/tools/fls/fls" doctor
'''
