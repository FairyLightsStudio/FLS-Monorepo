##
## Reindeer Config
##
## This file marks the root of the reindeer-managed third-party directory.

# Write output to the current directory (third-party/rust/BUCK)
third_party_dir = "."
# Provide Cargo environment variables to build scripts (CARGO_PKG_NAME, etc.)
cargo_env = true



# Configuration for generated BUCK file
[buck]
file_name = "BUCK"

rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
buildscript_genrule = "buildscript_run"

buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
"""

generated_file_header = """
##
## @generated by reindeer
## Do not edit by hand.
##
## Run `reindeer --third-party-dir=third-party/rust buckify` to regenerate.
##
"""
