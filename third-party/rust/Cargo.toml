[workspace]

[package]
name = "rust-third-party"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "top"
path = "top/main.rs"

[dependencies]
exn = "0.3"
async-nats = "0.50"
axum = "0.8"
bcrypt = "0"
bollard = "0.21"
buffa = { version = "0.9", features = ["json"] }
buffa-types = { version = "0.9", features = ["json"] }
clap = { version = "4", features = ["derive"] }
config = "0.15"
connectrpc = { version = "0.8", features = ["axum", "client", "tls"] }
connectrpc-build = "0.8"
futures = "0.3"
hex = "0.4"
http = "1"
http-body = "1"
opendal = "0.51"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
portable-pty = "0.9"
ractor = "0.16"
rand = "0.10"
rand-08 = { package = "rand", version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = [
    "runtime-tokio", "postgres", "chrono", "time", "json", "uuid"
] }
sysinfo = "0.39"
thiserror = "2"
thiserror-1 = { package = "thiserror", version = "1" }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
which = "8"
zbus = "5"

[patch.crates-io]
