[package]
name = "UserCenter"
version = "0.1.0"
edition = "2024"

[dependencies]
# RPC
connectrpc = { version = "0.8", features = ["axum", "client", "tls"] }

# Protobuf
buffa = { version = "0.9", features = ["json"] }

# Serialization (for generated message types)
serde = "1.0.228"
serde_json = "1.0.150"

# HTTP types (for generated client bounds)
http-body = "1.0.1"
http = "1.4.0"

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3.32"

# Web framework
axum = { version = "0.8", features = ["tokio", "http1"] }

# ELIZA bot dependencies
rand = "0.10.1"

# CORS (for browser clients)
tower-http = { version = "0.6.11", features = ["cors"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# TLS (optional — for https:// client endpoints and TLS/mTLS server)
webpki-roots = { version = "1.0.7", optional = true }
rustls-pemfile = { version = "2.2.0", optional = true }

# CLI argument parsing
clap = { version = "4.6.1", features = ["derive", "env"] }


[build-dependencies]

[features]
webpki-roots = ["dep:webpki-roots"]
rustls-pemfile = ["dep:rustls-pemfile"]
