name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fls:
    name: fls / Buck2
    runs-on: ubuntu-24.04
    steps:
      - name: 检出完整仓库
        uses: actions/checkout@v6

      - name: 安装锁定的 Buck2 与 Rust
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.17
          install_args: "buck2 rust"

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path tools/fls/Cargo.toml -- --check

      - name: 使用 Buck2 构建并测试 fls
        run: |
          buck2 build //tools/fls:fls --console=simple
          buck2 test //tools/fls:fls-test --console=simple

      - name: 检查整个项目图
        run: |
          fls_path="$(buck2 build //tools/fls:fls --show-full-output --console=simple | awk '$1 ~ /tools\/fls:fls/ { print $2 }')"
          "${fls_path}" doctor --json
