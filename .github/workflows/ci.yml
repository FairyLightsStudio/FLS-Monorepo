name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fls:
    name: fls / Bazel
    runs-on: ubuntu-24.04
    steps:
      - name: 检出完整仓库
        uses: actions/checkout@v6

      - name: 安装锁定的 Bazel 与 Rust
        uses: jdx/mise-action@v4
        with:
          version: 2026.7.17
          install_args: "bazel rust"

      - name: 安装 rustfmt
        run: rustup component add --toolchain 1.99.1 rustfmt

      - name: 检查 Rust 格式
        run: cargo fmt --manifest-path tools/fls/Cargo.toml -- --check

      - name: 使用 Bazel 构建并测试 fls
        run: |
          # bazelisk 从 .bazelversion 读取固定版本
          bazel build //tools/fls:fls
          bazel test //tools/fls:fls-test

      - name: 校验整个构建图可分析
        run: |
          bazel query //... > /dev/null
          echo "workspace target graph ok"
